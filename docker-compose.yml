# Compose local defaults (not production). Match DATABASE_URL in a local `.env`:
# postgresql://reviewpulse:reviewpulse@localhost:5432/reviewpulse?schema=public
services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewpulse
      POSTGRES_PASSWORD: reviewpulse
      POSTGRES_DB: reviewpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewpulse -d reviewpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
